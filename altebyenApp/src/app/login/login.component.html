<div class="login-container">
  <div class="login-card">
    <h2 class="title">🔒 تسجيل الدخول إلى <span>التبيان</span></h2>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>البريد الإلكتروني</label>
        <input type="email" formControlName="email" placeholder="أدخل بريدك الإلكتروني" />
      </div>

      <div class="form-group">
        <label>كلمة المرور</label>
        <input type="password" formControlName="password" placeholder="أدخل كلمة المرور" />
      </div>

      <p *ngIf="showError" class="error">❌ البريد الإلكتروني أو كلمة المرور غير صحيحة</p>

      <button class="login-btn" type="submit">تسجيل الدخول</button>
    </form>

    <p class="signup-link">
      ليس لديك حساب؟
      <a routerLink="/signup">إنشاء حساب</a>
    </p>
  </div>
</div>
