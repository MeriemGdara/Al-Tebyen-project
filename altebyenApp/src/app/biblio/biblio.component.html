<div class="container">
  <div class="video-player">
    <iframe
      width="100%"
      height="500"
      [src]="selectedVideo"
      frameborder="0"
      allowfullscreen>
    </iframe>
  </div>

  <div class="menu">
    <h2>📚 مواضيع الفيديو</h2>
    <button
      *ngFor="let video of videos"
      (click)="selectVideo(video)"
      [class.active]="video === currentVideo">
      {{ video.titre }}
    </button>
  </div>
</div>
