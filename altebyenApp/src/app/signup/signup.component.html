<div class="login-container">
  <div class="login-card">
    <h2 class="title">📝 إنشاء حساب في <span>التبيان</span></h2>

    <form [formGroup]="signupForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>الاسم الكامل</label>
        <input type="text" formControlName="username" placeholder="أدخل اسمك الكامل" />
      </div>

      <div class="form-group">
        <label>البريد الإلكتروني</label>
        <input type="email" formControlName="email" placeholder="أدخل بريدك الإلكتروني" />
      </div>

      <div class="form-group">
        <label>كلمة المرور</label>
        <input type="password" formControlName="password" placeholder="كلمة المرور" />
      </div>

      <p *ngIf="emailExists" class="error">⚠️ هذا البريد الإلكتروني مسجل بالفعل</p>
      <p *ngIf="success" class="success">✅ تم التسجيل بنجاح! سيتم توجيهك لتسجيل الدخول</p>

      <button class="login-btn" type="submit">إنشاء حساب</button>
    </form>

    <p class="signup-link">
      لديك حساب ؟
      <a routerLink="/Login">تسجيل الدخول</a>
    </p>
  </div>
</div>
